<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EVCalc+</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e1e2f">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #1e1e2f;
      color: #e0e0ff;
      padding: 2rem;
    }
    h1 {
      color: #c792ea;
    }
    input, select, button {
      padding: 0.5rem;
      margin: 0.3rem 0;
      background: #2e2e40;
      color: #ffffff;
      border: 1px solid #555;
      border-radius: 8px;
    }
    button {
      background-color: #7e57c2;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #9575cd;
    }
    .section {
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <h1>EVCalc+</h1>

  <div class="section">
    <h2>Charge Time Estimator</h2>
    <label>Battery Size (kWh): <input type="number" id="batterySize" value="60.4"></label><br>
    <label>Current Battery %: <input type="number" id="currentPercent" value="65"></label><br>
    <label>Target Battery %: <input type="number" id="targetPercent" value="90"></label><br>
    <label>Charger Speed (kW): <input type="number" id="chargerSpeed" value="25"></label><br>
    <button onclick="calculateTime()">Calculate</button>
    <p id="timeResult"></p>
  </div>

  <div class="section">
    <h2>Energy Added Estimator</h2>
    <label>Charging Duration (hours): <input type="number" id="hours" value="3"></label><br>
    <label>Charger Speed (kW): <input type="number" id="speed" value="6.3"></label><br>
    <button onclick="calculateEnergy()">Estimate</button>
    <p id="energyResult"></p>
  </div>

  <div class="section">
    <h2>Efficiency Converter</h2>
    <label>kWh/100km: <input type="number" id="kwhPer100" value="13.5"></label>
    <button onclick="convertEfficiency()">Convert</button>
    <p id="efficiencyResult"></p>
  </div>

  <div class="section">
    <h2>Cost Estimator</h2>
    <label>Electricity Cost (<span id="currency">$</span>/kWh): <input type="number" id="costPerKWh" value="0.15"></label><br>
    <label>Energy Used (kWh): <input type="number" id="kwhUsed" value="10"></label><br>
    <select id="currencySelector" onchange="updateCurrency()">
      <option value="$">USD ($)</option>
      <option value="€">EUR (€)</option>
      <option value="£">GBP (£)</option>
      <option value="Rp">IDR (Rp)</option>
      <option value="¥">JPY (¥)</option>
    </select><br>
    <button onclick="calculateCost()">Estimate Cost</button>
    <p id="costResult"></p>
  </div>

  <script>
    // Load user preferences from localStorage
    window.onload = function() {
      const storedCurrency = localStorage.getItem('currency');
      if (storedCurrency) {
        document.getElementById('currency').innerText = storedCurrency;
        document.getElementById('currencySelector').value = storedCurrency;
      }
    };

    function updateCurrency() {
      const currency = document.getElementById('currencySelector').value;
      document.getElementById('currency').innerText = currency;
      localStorage.setItem('currency', currency);
    }

    function calculateTime() {
      const batterySize = parseFloat(document.getElementById('batterySize').value);
      const currentPercent = parseFloat(document.getElementById('currentPercent').value);
      const targetPercent = parseFloat(document.getElementById('targetPercent').value);
      const chargerSpeed = parseFloat(document.getElementById('chargerSpeed').value);

      const kWhNeeded = batterySize * ((targetPercent - currentPercent) / 100);
      const hours = kWhNeeded / chargerSpeed;

      document.getElementById('timeResult').innerText = `Time needed: ${hours.toFixed(2)} hours`;
    }

    function calculateEnergy() {
      const hours = parseFloat(document.getElementById('hours').value);
      const speed = parseFloat(document.getElementById('speed').value);

      const energy = hours * speed;
      document.getElementById('energyResult').innerText = `Estimated Energy: ${energy.toFixed(2)} kWh`;
    }

    function convertEfficiency() {
      const kwhPer100 = parseFloat(document.getElementById('kwhPer100').value);
      const kmPerKwh = 100 / kwhPer100;
      document.getElementById('efficiencyResult').innerText = `${kwhPer100} kWh/100km = ${kmPerKwh.toFixed(2)} km/kWh`;
    }

    function calculateCost() {
      const rate = parseFloat(document.getElementById('costPerKWh').value);
      const used = parseFloat(document.getElementById('kwhUsed').value);
      const currency = document.getElementById('currency').innerText;

      const total = rate * used;
      document.getElementById('costResult').innerText = `Total Cost: ${currency} ${total.toFixed(2)}`;
    }
  </script>
</body>
</html>
