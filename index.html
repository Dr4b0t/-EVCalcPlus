<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
  <title>EVCalc+</title>
  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #121212;
      color: #e0e0e0;
    }
    .container {
      max-width: 600px;
      margin: auto;
      padding: 2rem;
    }
    h1 {
      color: #bb86fc;
    }
    input, select, button {
      width: 100%;
      margin: 0.5rem 0;
      padding: 0.75rem;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
    }
    input, select {
      background-color: #1f1f1f;
      color: #fff;
    }
    button {
      background-color: #3700b3;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #6200ea;
    }
    .result {
      margin-top: 1rem;
      padding: 1rem;
      background-color: #1f1f1f;
      border-radius: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>EVCalc+</h1>
    <label>Battery Capacity (kWh):</label>
    <input type="number" id="capacity" value="60.4" step="0.1"><label>Current Battery %:</label>
<input type="number" id="current" value="65">

<label>Target Battery %:</label>
<input type="number" id="target" value="90">

<label>Charging Speed (kW):</label>
<input type="number" id="speed" value="6.3" step="0.1">

<button onclick="calculateTime()">Estimate Charge Time</button>

<div class="result" id="output"></div>

<hr>

<label>Consumption (kWh/100km):</label>
<input type="number" id="consumption" value="13.5" step="0.1">
<button onclick="convertEfficiency()">Convert to km/kWh</button>
<div class="result" id="efficiencyOutput"></div>

<hr>

<label>Currency:</label>
<select id="currency">
  <option value="USD">USD</option>
  <option value="EUR">EUR</option>
  <option value="IDR">IDR</option>
  <option value="JPY">JPY</option>
</select>

<label>Cost per kWh:</label>
<input type="number" id="cost" value="0.15" step="0.01">
<button onclick="calculateCost()">Estimate Charging Cost</button>
<div class="result" id="costOutput"></div>

  </div>  <script>
    function calculateTime() {
      const cap = parseFloat(document.getElementById('capacity').value);
      const cur = parseFloat(document.getElementById('current').value);
      const tgt = parseFloat(document.getElementById('target').value);
      const spd = parseFloat(document.getElementById('speed').value);
      const output = document.getElementById('output');
      const percentToAdd = tgt - cur;
      const energyNeeded = (percentToAdd / 100) * cap;
      const time = energyNeeded / spd;

      output.innerHTML = `Estimated charging time: ${time.toFixed(2)} hours<br>
        Energy to add: ${energyNeeded.toFixed(2)} kWh<br>
        Battery after charge: ${(cur + percentToAdd).toFixed(1)}%`;
    }

    function convertEfficiency() {
      const consumption = parseFloat(document.getElementById('consumption').value);
      const kmPerKwh = 100 / consumption;
      document.getElementById('efficiencyOutput').innerText = `≈ ${kmPerKwh.toFixed(2)} km/kWh`;
    }

    function calculateCost() {
      const cap = parseFloat(document.getElementById('capacity').value);
      const cur = parseFloat(document.getElementById('current').value);
      const tgt = parseFloat(document.getElementById('target').value);
      const cost = parseFloat(document.getElementById('cost').value);
      const currency = document.getElementById('currency').value;

      const percentToAdd = tgt - cur;
      const energyNeeded = (percentToAdd / 100) * cap;
      const totalCost = energyNeeded * cost;

      document.getElementById('costOutput').innerText = `Estimated cost: ${currency} ${totalCost.toFixed(2)}`;
    }

    // LocalStorage persistence
    window.onload = () => {
      ['capacity', 'current', 'target', 'speed', 'consumption', 'cost', 'currency'].forEach(id => {
        const el = document.getElementById(id);
        if (localStorage.getItem(id)) {
          if (el.tagName === 'SELECT') el.value = localStorage.getItem(id);
          else el.value = parseFloat(localStorage.getItem(id));
        }
        el.addEventListener('change', () => localStorage.setItem(id, el.value));
      });
    };
  </script></body>
</html>
