<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png">
  <meta name="theme-color" content="#1e1b2e">
  <title>EVCalc+</title>
  <style>
    :root {
      --bg-color: #1e1b2e;
      --card-color: #2a253a;
      --text-color: #f0eaff;
      --accent: #9a5cff;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
    }
    main {
      padding: 1rem;
      max-width: 700px;
      margin: auto;
    }
    h1 {
      text-align: center;
      color: var(--accent);
    }
    .card {
      background: var(--card-color);
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 1rem;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
    label, select, input {
      display: block;
      margin-bottom: 0.5rem;
      width: 100%;
    }
    input, select {
      padding: 0.5rem;
      border-radius: 0.5rem;
      border: none;
      background: #3a334d;
      color: var(--text-color);
    }
    button {
      padding: 0.75rem;
      background: var(--accent);
      border: none;
      border-radius: 0.75rem;
      color: white;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 0.5rem;
    }
    .result {
      font-weight: bold;
      margin-top: 0.5rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <h1>EVCalc+</h1><div class="card">
  <label>Current Battery %:</label>
  <input type="number" id="currentPercent" min="0" max="100" />

  <label>Target Battery %:</label>
  <input type="number" id="targetPercent" min="0" max="100" />

  <label>Battery Capacity (kWh):</label>
  <input type="number" id="batteryCapacity" value="60.4" />

  <label>Charger Speed (kW):</label>
  <input type="number" id="chargerSpeed" />

  <button onclick="calculateTime()">Estimate Charge Time</button>
  <div class="result" id="timeResult"></div>
</div>

<div class="card">
  <label>Average Consumption (kWh/100km):</label>
  <input type="number" id="kwhPer100km" step="0.1" />

  <button onclick="convertEfficiency()">Convert to km/kWh</button>
  <div class="result" id="efficiencyResult"></div>
</div>

<div class="card">
  <label>Cost per kWh:</label>
  <input type="number" id="costPerKWh" />

  <label>Currency:</label>
  <select id="currency">
    <option value="USD">USD</option>
    <option value="EUR">EUR</option>
    <option value="IDR">IDR</option>
    <option value="JPY">JPY</option>
  </select>

  <button onclick="estimateCost()">Estimate Charge Cost</button>
  <div class="result" id="costResult"></div>
</div>

  </main>
  <script>
    function calculateTime() {
      const cur = parseFloat(currentPercent.value);
      const target = parseFloat(targetPercent.value);
      const cap = parseFloat(batteryCapacity.value);
      const speed = parseFloat(chargerSpeed.value);
      if (target > cur && speed > 0) {
        const toCharge = (target - cur) / 100 * cap;
        const hours = toCharge / speed;
        timeResult.innerText = `Estimated Time: ${hours.toFixed(2)} hours`;
      } else {
        timeResult.innerText = "Check your inputs";
      }
    }function convertEfficiency() {
  const kwh = parseFloat(kwhPer100km.value);
  if (kwh > 0) {
    const kmPerKwh = 100 / kwh;
    efficiencyResult.innerText = `${kmPerKwh.toFixed(2)} km per kWh`;
  } else {
    efficiencyResult.innerText = "Invalid input";
  }
}

function estimateCost() {
  const cur = parseFloat(currentPercent.value);
  const target = parseFloat(targetPercent.value);
  const cap = parseFloat(batteryCapacity.value);
  const price = parseFloat(costPerKWh.value);
  const unit = currency.value;
  if (target > cur && price >= 0) {
    const toCharge = (target - cur) / 100 * cap;
    const cost = toCharge * price;
    costResult.innerText = `Estimated Cost: ${cost.toFixed(2)} ${unit}`;
  } else {
    costResult.innerText = "Check your inputs";
  }
}

// Persistent local settings
window.onload = () => {
  batteryCapacity.value = localStorage.getItem("batteryCapacity") || "60.4";
  costPerKWh.value = localStorage.getItem("costPerKWh") || "";
  currency.value = localStorage.getItem("currency") || "USD";
};

batteryCapacity.oninput = () => localStorage.setItem("batteryCapacity", batteryCapacity.value);
costPerKWh.oninput = () => localStorage.setItem("costPerKWh", costPerKWh.value);
currency.onchange = () => localStorage.setItem("currency", currency.value);

  </script>
</body>
</html>
