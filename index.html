<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d203a" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon.png" />
  <title>EVCalc+</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #1b1a23;
      color: #eee;
    }
    header {
      background-color: #392749;
      padding: 1rem;
      text-align: center;
      color: #f2e8fc;
    }
    main {
      padding: 1.5rem;
    }
    h1 {
      font-size: 1.8rem;
      color: #f2e8fc;
    }
    label, input, select, button {
      display: block;
      margin: 0.5rem 0;
    }
    input, select {
      width: 100%;
      padding: 0.5rem;
      background-color: #2e2c39;
      border: 1px solid #544766;
      color: #eee;
      border-radius: 6px;
    }
    button {
      background-color: #7c4fc9;
      color: white;
      border: none;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #9c6eea;
    }
    .hidden {
      display: none;
    }
    #tips {
      background-color: #2a2133;
      border-left: 5px solid #c47aff;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    #moreFeatures {
      background-color: #241c2c;
      padding: 1rem;
      margin-top: 1rem;
      border-radius: 10px;
    }
    .notice {
      background-color: #3a2a4a;
      padding: 0.5rem 1rem;
      margin: 1rem 0;
      border-left: 4px solid #c88aff;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>EVCalc+</h1>
  </header>
  <main>
    <div id="tips" class="hidden"></div><label for="batterySize">Battery Size (kWh)</label>
<input type="number" id="batterySize" value="60.4" step="0.1" />

<label for="currentPercent">Current Battery %</label>
<input type="number" id="currentPercent" value="65" />

<label for="targetPercent">Target Battery %</label>
<input type="number" id="targetPercent" value="90" />

<label for="chargeSpeed">Charging Speed (kW)</label>
<input type="number" id="chargeSpeed" value="6.9" step="0.1" />

<button onclick="estimateChargeTime()">Estimate Charge Time</button>
<div id="result"></div>

<button onclick="toggleMore()">More</button>
<div id="moreFeatures" class="hidden">
  <label for="consumption">Average Consumption (kWh/100km)</label>
  <input type="number" id="consumption" value="13.5" step="0.1" oninput="convertConsumption()" />
  <div id="converted"></div>

  <button onclick="saveLog()">Save Charging Session</button>
  <button onclick="exportLogs()">Export Logs (CSV)</button>
  <div id="logStatus"></div>
</div>

  </main>
  <script>
    let logs = JSON.parse(localStorage.getItem('evLogs') || '[]');function estimateChargeTime() {
  const battery = parseFloat(document.getElementById('batterySize').value);
  const current = parseFloat(document.getElementById('currentPercent').value);
  const target = parseFloat(document.getElementById('targetPercent').value);
  const speed = parseFloat(document.getElementById('chargeSpeed').value);

  if (target > 90) {
    showTip("Charging to more than 90% regularly can reduce battery lifespan.");
  } else {
    hideTip();
  }

  const kWhNeeded = ((target - current) / 100) * battery;
  const hours = kWhNeeded / speed;
  const result = `Estimated time: ${hours.toFixed(2)} hours<br>kWh needed: ${kWhNeeded.toFixed(2)} kWh`;
  document.getElementById('result').innerHTML = result;
}

function showTip(text) {
  const tips = document.getElementById('tips');
  tips.textContent = text;
  tips.classList.remove('hidden');
}

function hideTip() {
  document.getElementById('tips').classList.add('hidden');
}

function convertConsumption() {
  const val = parseFloat(document.getElementById('consumption').value);
  if (val > 0) {
    const kmPerKWh = 100 / val;
    document.getElementById('converted').textContent = `≈ ${kmPerKWh.toFixed(2)} km per kWh`;
  }
}

function toggleMore() {
  document.getElementById('moreFeatures').classList.toggle('hidden');
}

function saveLog() {
  const date = new Date().toISOString();
  const battery = parseFloat(document.getElementById('batterySize').value);
  const current = parseFloat(document.getElementById('currentPercent').value);
  const target = parseFloat(document.getElementById('targetPercent').value);
  const speed = parseFloat(document.getElementById('chargeSpeed').value);
  const kWhNeeded = ((target - current) / 100) * battery;
  logs.push({ date, battery, current, target, speed, kWhAdded: kWhNeeded });
  localStorage.setItem('evLogs', JSON.stringify(logs));
  document.getElementById('logStatus').textContent = "Session saved locally.";
}

function exportLogs() {
  const csv = logs.map(l => `${l.date},${l.battery},${l.current},${l.target},${l.speed},${l.kWhAdded}`).join("\n");
  const blob = new Blob(["Date,Battery Size,Current %,Target %,Speed (kW),kWh Added\n" + csv], { type: 'text/csv' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = "evcalc_logs.csv";
  link.click();
}

  </script>
</body>
</html>
